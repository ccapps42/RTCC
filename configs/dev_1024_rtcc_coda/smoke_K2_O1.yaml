# Smoke test for the new rtcc_coda_topk arch at the K2_O1 cell geometry.
# Validates: GPU forward+backward in BF16, aux-loss backprop into router,
# AdamW8bit step, CART data loader, eval against CART val bins, DB logging,
# checkpoint save. Run on RTX 3090.
#
# 100 steps x 4 batch x 8 grad_accum x 1024 seq = 3,276,800 tokens
# Expected wall clock: ~85s train + ~30-60s eval + checkpoint  =  ~3 min
#
# Launch:
#   python scripts/launch_run.py --arch rtcc_coda_topk \
#       --config configs/dev_1024_rtcc_coda/smoke_K2_O1.yaml
model_dim: 1024
n_heads_prelude: 16
n_heads_recurrent: 16
n_heads_coda: 16
mla_latent_dim: 256
max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 6
total_steps: 100
warmup_steps: 10
lr_max: 3.0e-4
lr_min: 3.0e-5
batch_size: 4
grad_accum_steps: 8
seed: 42
checkpoint_every: 100
keep_last_n_checkpoints: 1
eval_every: 100
hardware: rtx3090
run_name: dev_1024_rtcc_coda/smoke_K2_O1
# Toroid coda (matches K2_O1 ablation cell)
up_dim: 4096
grid_side: 64
patch_size: 9
stride: 8
top_k: 2
moe_aux_loss_coef: 0.01
