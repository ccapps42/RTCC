# d=576 RTCC smoke test — 100 steps at paper settings, throughput measurement only
# S7 geometry (fewest experts, most representative of primary config)
# Run on RTX 3090. Read tokens/sec from output to estimate full run time.
# 100 steps x 8 accum x 4 batch x 1024 seq = 3,276,800 tokens
model_dim: 576
n_heads_prelude: 9
n_heads_recurrent: 9
n_heads_coda: 9
mla_latent_dim: 144
max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 8
total_steps: 100
warmup_steps: 10
batch_size: 4
grad_accum_steps: 8
checkpoint_every: 100
eval_every: 100
hardware: rtx3090
run_name: dev_576/smoke_rtcc
# S7 geometry
grid_rows: 24
grid_cols: 24
patch_size: 9
stride: 8
expert_hidden: 512
