# VRAM measurement: RTCC at batch=16, grad_accum=2 (same effective batch as paper runs)
# 16 * 2 * 1024 = 32,768 tokens/step (matches paper_576 effective batch)
# Run 30 steps and watch nvidia-smi for peak VRAM during steady state.
# If peak VRAM stays under 8 GB, 3 concurrent runs at batch=16 fit on a 3090.
model_dim: 576
n_heads_prelude: 9
n_heads_recurrent: 9
n_heads_coda: 9
mla_latent_dim: 144
max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 8
total_steps: 100
warmup_steps: 10
batch_size: 16
grad_accum_steps: 2
checkpoint_every: 100  # won't trigger
eval_every: 100        # won't trigger
hardware: rtx3090
run_name: dev_576/vram_test_b16
grid_rows: 24
grid_cols: 24
patch_size: 9
stride: 8
expert_hidden: 512
