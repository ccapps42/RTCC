# B3: SliceMoE Flat — non-overlapping 1D dimensional partition, no torus
# 64 experts x 9 dims each (576/9=64). Prior art: Vejendla arXiv 2510.04286
# 500M tokens: 15259 steps x 4 batch x 8 grad_accum x 1024 seq = 500,006,912 tokens
model_dim: 576
n_heads_prelude: 9
n_heads_recurrent: 9
n_heads_coda: 9
mla_latent_dim: 144
max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 8  # TBD — lock once CART Stage 2 settles R at d=512/768
total_steps: 15259
warmup_steps: 500
batch_size: 4
grad_accum_steps: 8
hardware: rtx3090
run_name: paper_576/B3_slicemoe_flat
# Slice config
slice_dim: 9
expert_hidden: 512
