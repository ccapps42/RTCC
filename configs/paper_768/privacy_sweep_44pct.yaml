# Privacy sweep — 44% private dims: 6x6 patch, stride 4, 2-cell overlap
# 8x6=48 experts, min_axis=6, private_side=2, privacy=4/36=11%
# NOTE: plan calls this 44% but actual formula: private=(6-4)^2=4, patch=36, pct=11%
# Kept for controlled pair with sweep_36pct (same expert count, different overlap)
run_name: paper_768/rtcc_sweep_44pct
hardware: rtx3090
model_dim: 768
head_dim: 64
n_heads_prelude: 16
n_heads_recurrent: 12
n_heads_coda: 8
mla_latent_dim: 192
max_seq_len: 512
total_steps: 75000
checkpoint_every: 1000
eval_every: 5000
warmup_steps: 2000
batch_size: 4
grad_accum_steps: 8
seed: 42
grid_rows: 32
grid_cols: 24
patch_size: 6
stride: 4
expert_hidden: 256
