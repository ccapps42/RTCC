# RTCC coda top-K | K=2 of 64 experts | overlap=3 (patch=11x11, 121 dims)
# expert_hidden auto-derives to 48 (compression 0.40). Coda ~9.7M params.
# 1B tokens: 30500 steps x 4 batch x 8 grad_accum x 1024 seq = 999,948,288 tokens
model_dim: 1024
n_heads_prelude: 16
n_heads_recurrent: 16
n_heads_coda: 16
mla_latent_dim: 256
max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 6
total_steps: 30500
warmup_steps: 2000
lr_max: 3.0e-4
lr_min: 3.0e-5
batch_size: 4
grad_accum_steps: 8
seed: 42
hardware: rtx3090
run_name: paper_1024_rtcc_coda/K2_O3
# Toroid coda
up_dim: 4096
grid_side: 64
patch_size: 11
stride: 8
top_k: 2
moe_aux_loss_coef: 0.01
