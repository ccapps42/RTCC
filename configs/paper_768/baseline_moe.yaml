# Standard MoE baseline — 768-dim, paper run on RTX 3090
# 16 routed + 2 shared experts, expert_dim=256, top-k=2
run_name: paper_768/baseline_moe
hardware: rtx3090
model_dim: 768
head_dim: 64
n_heads_prelude: 16
n_heads_recurrent: 12
n_heads_coda: 8
mla_latent_dim: 192
max_seq_len: 512
total_steps: 75000
checkpoint_every: 1000
eval_every: 5000
warmup_steps: 2000
batch_size: 4
grad_accum_steps: 8
seed: 42
# MoE
n_experts: 16
n_shared: 2
top_k: 2
expert_dim: 256
moe_aux_loss_coef: 0.01
