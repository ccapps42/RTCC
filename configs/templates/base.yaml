# Base config — all run configs inherit these defaults
vocab_size: 50000
model_dim: 768
max_seq_len: 512
head_dim: 64

n_heads_prelude: 16
n_heads_recurrent: 12
n_heads_coda: 8
mla_latent_dim: 192

prelude_layers: 4
coda_layers: 1
max_loop_iters: 8

n_hyper: 3
lie_dim: 32
lti_init_value: 0.9

warmup_steps: 2000
lr_max: 3.0e-4
lr_min: 3.0e-5
weight_decay: 0.1
grad_clip: 1.0
batch_size: 4
grad_accum_steps: 8
seed: 42
total_steps: 75000
checkpoint_every: 1000
keep_last_n_checkpoints: 5
eval_every: 5000

hardware: rtx3090
db_path: K:/projects/RTCC_Paper_2/db/rtcc_experiments.db
hf_cache_dir: K:/projects/Model_Paper_1/data/hf_cache
val_parquet: K:/projects/RTCC_Paper_2/data/validation/val.parquet
