max_seq_len: 1024
prelude_layers: 6
coda_layers: 1
max_loop_iters: 8  # TBD — lock once CART Stage 2 settles R at d=512/768
total_steps: 15259
warmup_steps: 500
batch_size: 4
grad_accum_steps: 8
hardware: rtx3090
run_name: paper_1024/S7_rtcc_60pct
grid_rows: 32
grid_cols: 32
patch_size: 9
stride: 8
expert_hidden: 512
